plugins {
    id 'java'
    id 'application'
}

group = 'com.tallerprogramacion'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.tallerprogramacion.application.Main'
}

test {
    useJUnitPlatform()
}